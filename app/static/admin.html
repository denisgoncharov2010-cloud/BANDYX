
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BANDYX — Админ-панель</title>
<style>
body{margin:0;background:#160d13;color:white;font-family:Arial;padding:18px}
header{background:#6e1735;padding:18px;border-radius:12px;text-align:center}
.card{background:#291722;border:1px solid #693047;padding:16px;border-radius:12px;margin-top:16px}
input,select,button{width:100%;padding:12px;margin:7px 0;border-radius:8px;box-sizing:border-box}
input,select{background:#170f15;color:white;border:1px solid #754057}
button{background:#a52c50;color:white;border:0;font-weight:bold;cursor:pointer}
.round{padding:12px;margin:10px 0;background:#170f15;border:1px solid #754057;border-radius:9px}
.round button{width:48%;display:inline-block}
.open{color:#70e49b}
.closed{color:#ff9bab}
#resultMessage{color:#ffb7cb}
.preview{max-width:130px;max-height:130px;display:none;margin:10px auto;border-radius:10px}
.hint{color:#c9aab8;font-size:13px}
</style>
</head>
<body>

<header>
<h1>BANDYX</h1>
<p>Панель администратора</p>
</header>

<div class="card">
<h3>Доступ администратора</h3>
<input id="adminSecret" type="password" placeholder="Пароль администратора">
<p>Введи пароль администратора из Render.</p>
</div>

<div class="card">
<h3>Добавить клуб</h3>
<input id="club" placeholder="Название клуба">
<label>Эмблема клуба</label>
<input id="clubImage" type="file" accept="image/jpeg,image/png,image/webp">
<img id="clubPreview" class="preview" alt="Предпросмотр эмблемы">
<button onclick="addClub()">Добавить клуб</button>
</div>

<div class="card">
<h3>Добавить игрока</h3>
<input id="first" placeholder="Имя игрока">
<input id="last" placeholder="Фамилия игрока">

<select id="position">
<option value="forward">Нападающий</option>
<option value="midfielder">Полузащитник</option>
<option value="defender">Защитник</option>
<option value="goalie">Вратарь</option>
</select>

<input id="price" type="number" placeholder="Цена (5000–35000)">
<select id="clubSelect">
<option value="">Выбери клуб</option>
</select>

<label>Фотография игрока</label>
<input id="playerImage" type="file" accept="image/jpeg,image/png,image/webp">
<img id="playerPreview" class="preview" alt="Предпросмотр фотографии">

<button onclick="addPlayer()">Добавить игрока</button>
</div>

<div class="card">
<h3>Управление турами</h3>
<input id="round" placeholder="Название тура, например Тур 1">
<button onclick="addRound()">Создать тур</button>
<button onclick="loadRounds()">Обновить список туров</button>
<div id="roundList">Загрузка туров...</div>
</div>

<div class="card">
<h3>Добавить статистику игрока</h3>
<input id="roundId" type="number" placeholder="ID тура">
<input id="playerId" type="number" placeholder="ID игрока">
<input id="goals" type="number" placeholder="Голы" value="0">
<input id="assists" type="number" placeholder="Передачи" value="0">
<input id="conceded" type="number" placeholder="Пропущенные мячи" value="0">
<input id="penalties" type="number" placeholder="Отражённые пенальти" value="0">

<select id="teamResult">
<option value="win">Победа</option>
<option value="draw">Ничья</option>
<option value="loss">Поражение</option>
</select>

<button onclick="addStats()">Сохранить статистику</button>
</div>

<p id="resultMessage"></p>

<script>
async function api(url, method="GET", data=null){
    const secret = document.getElementById("adminSecret").value;

    const options = {
        method,
        headers: {
            "Content-Type": "application/json",
            "X-Admin-Secret": secret
        }
    };

    if(data !== null){
        options.body = JSON.stringify(data);
    }

    const response = await fetch(url, options);
    const result = await response.json();

    if(!response.ok){
        throw new Error(result.detail || "Ошибка");
    }

    return result;
}

async function uploadImage(inputId){
    const file = document.getElementById(inputId).files[0];

    if(!file) return null;

    if(file.size > 10 * 1024 * 1024){
        throw new Error("Файл больше 10 МБ");
    }

    const formData = new FormData();
    formData.append("file", file);

    const response = await fetch("/api/upload", {
        method: "POST",
        headers: {
            "X-Admin-Secret": document.getElementById("adminSecret").value
        },
        body: formData
    });

    const result = await response.json();

    if(!response.ok){
        throw new Error(result.detail || "Не удалось загрузить изображение");
    }

    const imageUrl = result.url || result.public_url;

    if(!imageUrl){
        throw new Error("Сервер не вернул ссылку на изображение");
    }

    return imageUrl;
}

function previewImage(inputId, previewId){
    const input = document.getElementById(inputId);
    const preview = document.getElementById(previewId);

    input.addEventListener("change", () => {
        const file = input.files[0];

        if(!file){
            preview.style.display = "none";
            return;
        }

        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    });
}

previewImage("clubImage", "clubPreview");
previewImage("playerImage", "playerPreview");

async function addClub(){
    try{
        const name = document.getElementById("club").value.trim();

        if(!name) throw new Error("Введи название клуба");

        showMessage("Загружаем эмблему...");

        const logo = await uploadImage("clubImage");

        await api("/api/clubs", "POST", {
            name: name,
            logo: logo
        });

        showMessage("Клуб добавлен!");
        document.getElementById("club").value = "";
        document.getElementById("clubImage").value = "";
        document.getElementById("clubPreview").style.display = "none";
        await loadClubs();
    }catch(e){
        showError(e);
    }
}

async function loadClubs(){
    try{
        const clubs = await api("/api/clubs");

        document.getElementById("clubSelect").innerHTML =
            '<option value="">Выбери клуб</option>' +
            clubs.map(c =>
                `<option value="${c.id}">${c.name}</option>`
            ).join("");
    }catch(e){}
}

async function addPlayer(){
    try{
        const first = document.getElementById("first").value.trim();
        const last = document.getElementById("last").value.trim();
        const price = Number(document.getElementById("price").value);
        const clubId = Number(document.getElementById("clubSelect").value);

        if(!first || !last) throw new Error("Введи имя и фамилию игрока");
        if(!price) throw new Error("Укажи цену игрока");

        showMessage("Загружаем фотографию...");

        const photo = await uploadImage("playerImage");

        await api("/api/players", "POST", {
            first_name: first,
            last_name: last,
            position: document.getElementById("position").value,
            price: price,
            club_id: clubId || null,
            photo: photo
        });

        showMessage("Игрок добавлен!");
        document.getElementById("first").value = "";
        document.getElementById("last").value = "";
        document.getElementById("price").value = "";
        document.getElementById("playerImage").value = "";
        document.getElementById("playerPreview").style.display = "none";
    }catch(e){
        showError(e);
    }
}

async function addRound(){
    try{
        const name = document.getElementById("round").value.trim();

        if(!name) throw new Error("Введи название тура");

        const result = await api(
            "/api/rounds?name=" + encodeURIComponent(name),
            "POST"
        );

        document.getElementById("round").value = "";
        document.getElementById("roundId").value = result.id;

        showMessage("Тур создан! ID тура: " + result.id);
        await loadRounds();
    }catch(e){
        showError(e);
    }
}

async function loadRounds(){
    const container = document.getElementById("roundList");

    try{
        const rounds = await api("/api/rounds");

        if(!rounds.length){
            container.textContent = "Пока туров нет";
            return;
        }

        container.innerHTML = rounds.map(r => `
            <div class="round">
                <strong>${r.name}</strong>
                <p>ID: ${r.id}</p>
                <p class="${r.is_open ? 'open' : 'closed'}">
                    ${r.is_open ? '● Тур открыт' : '● Тур закрыт'}
                </p>
                <button onclick="openRound(${r.id})">Открыть тур</button>
                <button onclick="closeRound(${r.id})">Закрыть тур</button>
            </div>
        `).join("");

    }catch(e){
        container.textContent = "Не удалось загрузить туры";
    }
}

async function openRound(id){
    try{
        await api(`/api/rounds/${id}/open`, "POST");
        document.getElementById("roundId").value = id;
        showMessage("Тур открыт!");
        await loadRounds();
    }catch(e){
        showError(e);
    }
}

async function closeRound(id){
    try{
        await api(`/api/rounds/${id}/close`, "POST");
        showMessage("Тур закрыт!");
        await loadRounds();
    }catch(e){
        showError(e);
    }
}

async function addStats(){
    try{
        await api("/api/stats", "POST", {
            round_id: Number(document.getElementById("roundId").value),
            player_id: Number(document.getElementById("playerId").value),
            goals: Number(document.getElementById("goals").value),
            assists: Number(document.getElementById("assists").value),
            conceded: Number(document.getElementById("conceded").value),
            penalties_saved: Number(document.getElementById("penalties").value),
            team_result: document.getElementById("teamResult").value
        });

        showMessage("Статистика сохранена!");
    }catch(e){
        showError(e);
    }
}

function showMessage(message){
    document.getElementById("resultMessage").textContent = message;
}

function showError(e){
    document.getElementById("resultMessage").textContent =
        "Ошибка: " + e.message;
}

loadClubs();
loadRounds();
</script>

</body>
</html>
